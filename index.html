<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070c"><title>A special letter for Artmis</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;touch-action:manipulation}canvas{display:block;width:100vw;height:100dvh}</style></head>
<body><canvas id="scene" aria-label="An animated letter that opens to reveal a glowing text-art red rose for Artmis. Tap to replay."></canvas>
<script>
const NAME='Artmis',MESSAGE='I love you more than words can say',WORDS='I LOVE YOU  ',W=1000,H=700;
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let start=performance.now(),seed=7;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const stars=Array.from({length:105},()=>[rand()*W,rand()*H,.5+rand()*1.5,rand()*6]);
const glyphs=['@','#','8','&','%','+','*','=',':'];let roseDots=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
function polygon(a,fill,stroke,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,color,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function text(x,y,value,color,size=10){ctx.fillStyle=color;ctx.font='bold '+size+'px Courier New, monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(value,x,y)}
// Draw a layered rose into an offscreen canvas, then translate its colored pixels into glowing ASCII characters.
function buildRose(){
 const m=document.createElement('canvas');m.width=W;m.height=H;const c=m.getContext('2d');
 function petal(fill,draw){c.beginPath();draw(c);c.closePath();c.fillStyle=fill;c.fill()}
 // Stem and leaves, drawn behind the flower.
 c.strokeStyle='#3baf93';c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(499,327);c.bezierCurveTo(488,399,516,480,500,584);c.stroke();
 petal('#2c947e',p=>{p.moveTo(499,470);p.bezierCurveTo(436,400,390,420,353,393);p.bezierCurveTo(378,482,439,496,499,470)});
 petal('#52c3a7',p=>{p.moveTo(500,470);p.bezierCurveTo(446,437,408,440,370,410);p.bezierCurveTo(405,468,449,483,500,470)});
 petal('#237966',p=>{p.moveTo(504,515);p.bezierCurveTo(565,442,605,454,644,435);p.bezierCurveTo(617,526,560,540,504,515)});
 petal('#48b99a',p=>{p.moveTo(504,515);p.bezierCurveTo(554,479,592,481,628,449);p.bezierCurveTo(596,509,557,519,504,515)});
 // Distinct overlapping petals form a realistic rose bloom, not a simple oval.
 petal('#8f183b',p=>{p.moveTo(496,359);p.bezierCurveTo(423,349,367,313,361,245);p.bezierCurveTo(355,181,417,171,450,208);p.bezierCurveTo(460,166,504,146,539,195);p.bezierCurveTo(590,153,648,195,632,251);p.bezierCurveTo(625,312,573,355,496,359)});
 petal('#d42c52',p=>{p.moveTo(487,337);p.bezierCurveTo(426,327,386,297,388,238);p.bezierCurveTo(388,201,421,197,452,229);p.bezierCurveTo(441,275,466,309,487,337)});
 petal('#ee5270',p=>{p.moveTo(468,316);p.bezierCurveTo(408,289,404,238,423,210);p.bezierCurveTo(436,193,452,202,471,223);p.bezierCurveTo(444,246,446,283,468,316)});
 petal('#a7193f',p=>{p.moveTo(504,348);p.bezierCurveTo(552,326,608,296,606,236);p.bezierCurveTo(606,201,574,197,548,226);p.bezierCurveTo(559,275,530,314,504,348)});
 petal('#f04a68',p=>{p.moveTo(528,315);p.bezierCurveTo(589,291,591,241,576,210);p.bezierCurveTo(564,196,545,203,530,225);p.bezierCurveTo(557,254,548,285,528,315)});
 petal('#b92248',p=>{p.moveTo(499,333);p.bezierCurveTo(446,299,441,263,466,229);p.bezierCurveTo(483,209,519,211,539,232);p.bezierCurveTo(561,260,541,303,499,333)});
 petal('#fb6b83',p=>{p.moveTo(495,304);p.bezierCurveTo(457,277,461,247,478,230);p.bezierCurveTo(494,217,524,221,534,239);p.bezierCurveTo(548,267,523,292,495,304)});
 petal('#86142f',p=>{p.moveTo(503,286);p.bezierCurveTo(475,271,477,250,490,241);p.bezierCurveTo(510,230,531,249,520,263);p.bezierCurveTo(513,272,499,269,496,260)});
 petal('#ff9ca9',p=>{p.moveTo(484,242);p.bezierCurveTo(494,225,519,230,527,243);p.bezierCurveTo(512,236,496,238,484,242)});
 const pixels=c.getImageData(0,0,W,H).data;roseDots=[];let i=0;
 for(let y=146;y<595;y+=9)for(let x=346;x<650;x+=8){const k=(Math.floor(y)*W+Math.floor(x))*4;if(pixels[k+3]<100)continue;const red=pixels[k],green=pixels[k+1],blue=pixels[k+2];roseDots.push({x,y,color:'rgb('+red+','+green+','+blue+')',char:glyphs[(x*7+y*13)%glyphs.length],order:i++})}
}buildRose();
function draw(now){const t=(now-start)/1000;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#05070c';ctx.fillRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(s,0,0,s,(canvas.width-W*s)/2,(canvas.height-H*s)/2);
 for(const [x,y,r,phase] of stars)if(Math.sin(t*1.8+phase)>-.2){ctx.beginPath();ctx.arc(x,y,r/2,0,Math.PI*2);ctx.fillStyle='#8792ae';ctx.fill()}
 if(t<4.3){const p=Math.min(Math.max((t-1)/1.2,0),1),rise=Math.min(Math.max((t-2.1)/1.5,0),1);polygon([245,285,500,405-210*p,755,285],'#9a5361','#e8a0a8');if(rise){const y=300-145*rise;polygon([300,y,700,y,700,y+240,300,y+240],'#f9e8da','#eab9ae');text(500,y+55,'A LETTER FOR YOU','#aa5964',15);text(500,y+110,'♥','#c54460',32)}polygon([245,285,755,285,755,530,245,530],'#c77f82','#f2b4ad');polygon([245,285,500,442,755,285,755,530,245,530],'#d99592','#f2b4ad');line([245,530,500,365,755,530],'#f2b4ad');text(500,475,'♥','#b43f57',30);text(500,600,'A little something for you...','#e9bfc5',15)}
 else{
 const progress=Math.min((t-4.3)/2.7,1);ctx.save();ctx.shadowBlur=6;ctx.shadowColor='#d4315b';
 for(const d of roseDots){if((d.y-145)/450>progress)continue;const shimmer=.8+.2*Math.sin(t*2+d.x*.045+d.y*.03);ctx.globalAlpha=shimmer;text(d.x,d.y,d.char,d.color,10)}ctx.restore();ctx.globalAlpha=1;
 // Thin, horizontal blue digital scan lines and tiny white particles, matching the reference aesthetic.
 ctx.save();ctx.globalAlpha=.18;for(let i=0;i<17;i++){const y=172+i*21+Math.sin(t+i)*4,x=200+Math.sin(i*17+t*.3)*90;line([x,y,800-x*.1,y],'#4a83c8',1)}ctx.restore();
 if(progress>=1){text(500,626,'For '+NAME+' ♥','#ffc2cf',20);text(500,656,MESSAGE,'#e4c7d0',12)}
 }
 requestAnimationFrame(draw)
}requestAnimationFrame(draw);canvas.addEventListener('click',()=>{start=performance.now()});
</script></body></html>
