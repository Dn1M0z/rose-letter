<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070710"><title>A special letter</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070710;touch-action:manipulation}canvas{display:block;width:100vw;height:100dvh}</style></head><body><canvas id="scene" aria-label="Animated love letter for Artmis"></canvas><script>
const NAME='Artmis',MESSAGE='I love you more than words can say',WORDS='I LOVE YOU  ',W=1000,H=700;
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let start=performance.now();
let seed=7;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const stars=Array.from({length:85},()=>[rand()*W,rand()*H,.5+rand()*1.5,rand()*6]);
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px'}addEventListener('resize',resize);resize();
function polygon(a,fill,stroke,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function line(a,color,width=2){ctx.beginPath();ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function text(x,y,value,color,size=10){ctx.fillStyle=color;ctx.font=`bold ${size}px Courier, monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(value,x,y)}
function draw(now){const t=(now-start)/1000;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#070710';ctx.fillRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(s,0,0,s,(canvas.width-W*s)/2,(canvas.height-H*s)/2);
for(const [x,y,r,phase] of stars)if(Math.sin(t*2+phase)>-.2){ctx.beginPath();ctx.arc(x,y,r/2,0,Math.PI*2);ctx.fillStyle='#817c9f';ctx.fill()}
if(t<4.3){const p=Math.min(Math.max((t-1)/1.2,0),1),rise=Math.min(Math.max((t-2.1)/1.5,0),1);polygon([245,285,500,405-210*p,755,285],'#9a5361','#e8a0a8');if(rise){const y=300-145*rise;polygon([300,y,700,y,700,y+240,300,y+240],'#f9e8da','#eab9ae');text(500,y+55,'A LETTER FOR YOU','#aa5964',15);text(500,y+110,'♥','#c54460',32)}polygon([245,285,755,285,755,530,245,530],'#c77f82','#f2b4ad');polygon([245,285,500,442,755,285,755,530,245,530],'#d99592','#f2b4ad');line([245,530,500,365,755,530],'#f2b4ad');text(500,475,'♥','#b43f57',30);text(500,600,'A little something for you...','#e9bfc5',15)}
else{const progress=Math.min((t-4.3)/2.3,1),offset=Math.floor(t*3);for(let row=0;row<31;row++){const y=110+row*14;for(let col=0;col<61;col++){const x=200+col*10,nx=(x-500)/190,ny=(y-260)/125;const bloom=nx*nx+(ny*.90)**2<1&&y<330&&y<320-45*Math.abs(nx),stem=y>=330&&y<535&&Math.abs(x-500)<7,leafL=((x-445)/60)**2+((y-420)/24)**2<1&&x<500&&y>385,leafR=((x-555)/60)**2+((y-465)/24)**2<1&&x>500&&y>425;if(!(bloom||stem||leafL||leafR)||(row*61+col)/(31*61)>progress)continue;const char=WORDS[(col+row*5+offset)%WORDS.length];if(char===' ')continue;let color;if(bloom){const wave=Math.sin(nx*17+ny*12+t*.7);color=wave>.35?'#ff7993':wave>-.5?'#f13b60':'#a7193f'}else color=(row+col)%3?'#74c69d':'#418b72';text(x,y,char,color,9)}}if(progress>=1){text(500,590,`For ${NAME} ♥`,'#ffc2cf',20);text(500,625,MESSAGE,'#e4c7d0',12)}}requestAnimationFrame(draw)}requestAnimationFrame(draw);canvas.addEventListener('click',()=>start=performance.now());
</script></body></html>
